<tr x-show="status==='All'||status==='{{a.status}}'"><td><input type="checkbox" value="{{a.id}}" x-model="selected"></td><td>{{a.reference}}</td><td>{{a.patient_name}}</td><td>{{a.doctor.full_name}}</td><td>{{a.appointment_date}} · {{a.time_slot}}</td><td><span class="status {{a.status|lower}}">{{a.status}}</span></td><td>{% if a.status == 'Pending' %}<button hx-post="/appointments/{{a.id}}/confirm/" hx-target="closest tr" hx-swap="outerHTML">Confirm</button><button hx-post="/appointments/{{a.id}}/cancel/" hx-confirm="Cancel this appointment?" hx-target="closest tr" hx-swap="outerHTML">Cancel</button>{% endif %}</td></tr>
