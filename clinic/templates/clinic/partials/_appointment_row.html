<tr x-show="status==='All'||status==='{{a.status}}'"><td><input type="checkbox" value="{{a.id}}" x-model="selected" aria-label="Select {{a.reference}}"></td><td><span class="reference">{{a.reference}}</span></td><td class="patient-cell"><strong>{{a.patient_name}}</strong><small>{{a.visit_type}}</small></td><td class="doctor-cell"><strong>{{a.doctor.full_name}}</strong><small>{{a.doctor.specialty.name}}</small></td><td><strong>{{a.appointment_date|date:'M d, Y'}}</strong><br><small class="muted">{{a.time_slot}}</small></td><td><span class="status {{a.status|lower}}">{{a.status}}</span></td><td><div class="table-actions">{% if a.status == 'Pending' %}<button class="mini-btn confirm" hx-post="/appointments/{{a.id}}/confirm/" hx-target="closest tr" hx-swap="outerHTML">Confirm</button><button class="mini-btn cancel" hx-post="/appointments/{{a.id}}/cancel/" hx-confirm="Cancel this appointment?" hx-target="closest tr" hx-swap="outerHTML">Cancel</button>{% else %}<span class="muted">No action needed</span>{% endif %}</div></td></tr>
