{% load static %}<!doctype html><html :class="{'dark':$store.theme.dark}" x-data><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}MediBook{% endblock %}</title><link rel="stylesheet" href="{% static 'clinic/css/app.css' %}"><script src="https://unpkg.com/htmx.org@2.0.4"></script><script defer src="{% static 'clinic/js/app.js' %}"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script></head><body><nav x-data="{open:false}"><a href="/" class="brand">MediBook</a><button class="hamb" @click="open=!open" :aria-expanded="open" @keydown.escape.window="open=false">☰</button><div class="navlinks" :class="{'open':open}" @click.outside="open=false"><a href="/">Doctors</a><a href="/manage/appointments/">Clinic Management</a><button @click="$store.theme.toggle()">◐ Theme</button></div></nav><main>{% if messages %}<div>{% for message in messages %}{{message}}{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main><footer>MediBook Clinic Appointments · IT 424 Practical</footer><div class="toasts" x-data><template x-for="t in $store.toasts.items" :key="t.id"><div class="toast" x-text="t.message" x-transition></div></template></div></body></html>
