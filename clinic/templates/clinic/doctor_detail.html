{% extends 'clinic/base.html' %}{% block content %}<div class="detail" x-data="tabs()"><img src="{{doctor.photo.url}}"><div><span class="badge yes">● Accepting</span><h1>{{doctor.full_name}}</h1><p>{{doctor.specialty.name}}</p><div role="tablist" class="tabs"><button @click="tab='about'" :aria-selected="tab==='about'">About</button><button @click="tab='fees'" :aria-selected="tab==='fees'">Fees</button><button @click="tab='availability'" :aria-selected="tab==='availability'">Availability</button></div><div x-show="tab==='about'">{{doctor.bio}}</div><div x-show="tab==='fees'">Consultation fee: ₱{{doctor.consultation_fee}}</div><div x-show="tab==='availability'">Monday-Saturday · 9:00 AM-3:00 PM</div>{% if doctor.is_accepting %}<a class="primary big" href="/doctors/{{doctor.id}}/book/">Book appointment</a>{% endif %}</div></div>{% endblock %}
